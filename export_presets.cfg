html/custom_html_shell=""
html/head_include="<style>
html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #F6B04A !important; overscroll-behavior: none; }
#canvas { position: fixed !important; left: 0; top: 0; display: block; transform-origin: 0 0; touch-action: none; }
</style>
<script>
// Tesouros do Nordeste - jogo sempre na horizontal (Correcao 3)
// 1) No primeiro toque: tela cheia + screen.orientation.lock('landscape').
// 2) Plano B (iPhone ou navegador que bloqueia): se a janela estiver em pe, o canvas e girado 90 graus por CSS
//    e as coordenadas de toque/mouse sao convertidas para o sistema girado. Nunca mostramos 'gire o celular'.
(function () {
  var rotated = false;
  var lastKey = '';

  function viewSize() {
    var w = window.innerWidth || document.documentElement.clientWidth;
    var h = window.innerHeight || document.documentElement.clientHeight;
    return [w, h];
  }

  function layout() {
    var c = document.getElementById('canvas');
    if (!c) { return; }
    var s = viewSize();
    var W = s[0];
    var H = s[1];
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var portrait = H > W;
    var key = W + 'x' + H + ':' + dpr + ':' + portrait;
    if (key === lastKey && c.width > 0) { return; }
    lastKey = key;
    rotated = portrait;
    window.tdnRotated = portrait;
    window.tdnViewW = W;
    var cw = portrait ? H : W;
    var ch = portrait ? W : H;
    c.style.width = cw + 'px';
    c.style.height = ch + 'px';
    c.width = Math.floor(cw * dpr);
    c.height = Math.floor(ch * dpr);
    if (portrait) {
      // gira 90 graus no sentido horario: canto (0,0) do jogo vai para o canto superior direito
      c.style.transform = 'translateX(' + W + 'px) rotate(90deg)';
    } else {
      c.style.transform = 'none';
    }
  }

  // Conversao de coordenadas quando girado: a Godot usa clientX/clientY e canvas.getBoundingClientRect()
  function patchCoords(proto) {
    if (!proto) { return; }
    var dx = Object.getOwnPropertyDescriptor(proto, 'clientX');
    var dy = Object.getOwnPropertyDescriptor(proto, 'clientY');
    if (!dx || !dy || !dx.get || !dy.get) { return; }
    Object.defineProperty(proto, 'clientX', {
      configurable: true, enumerable: true,
      get: function () {
        if (!rotated) { return dx.get.call(this); }
        return dy.get.call(this);
      }
    });
    Object.defineProperty(proto, 'clientY', {
      configurable: true, enumerable: true,
      get: function () {
        if (!rotated) { return dy.get.call(this); }
        return window.tdnViewW - dx.get.call(this);
      }
    });
  }
  try { patchCoords(window.Touch && Touch.prototype); } catch (e) {}
  try { patchCoords(window.MouseEvent && MouseEvent.prototype); } catch (e) {}

  function patchRect() {
    var c = document.getElementById('canvas');
    if (!c || c.tdnRectPatched) { return; }
    c.tdnRectPatched = true;
    var orig = c.getBoundingClientRect.bind(c);
    c.getBoundingClientRect = function () {
      if (!rotated) { return orig(); }
      var w = parseFloat(c.style.width) || 0;
      var h = parseFloat(c.style.height) || 0;
      return { x: 0, y: 0, left: 0, top: 0, right: w, bottom: h, width: w, height: h };
    };
  }

  // Primeiro toque/clique/tecla: tela cheia e trava em paisagem (Android/Chrome)
  var triedFullscreen = false;
  function goFullscreenLandscape() {
    if (triedFullscreen) { return; }
    triedFullscreen = true;
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    var lock = function () {
      try {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function () {});
        }
      } catch (e) {}
      setTimeout(layout, 300);
    };
    try {
      if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
        var p = req.call(el, { navigationUI: 'hide' });
        if (p && p.then) { p.then(lock).catch(lock); } else { lock(); }
      } else {
        lock();
      }
    } catch (e) { lock(); }
  }
  ['touchend', 'pointerup', 'mousedown', 'keydown'].forEach(function (t) {
    window.addEventListener(t, goFullscreenLandscape, { capture: true, passive: true });
  });

  function init() {
    patchRect();
    lastKey = '';
    layout();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(function () { lastKey = ''; layout(); }, 250); });
  document.addEventListener('fullscreenchange', function () { setTimeout(function () { lastKey = ''; layout(); }, 150); });
  // seguranca para navegadores que nao disparam resize ao girar
  setInterval(layout, 700);
})();
</script>"
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
