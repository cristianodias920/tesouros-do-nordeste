<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Tesouros do Nordeste: Aventura no Piauí</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #faf0d9;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>
html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #F6B04A !important; overscroll-behavior: none; }
#canvas { position: fixed !important; left: 0; top: 0; display: block; transform-origin: 0 0; touch-action: none; }
</style>
<script>
// Tesouros do Nordeste - jogo sempre na horizontal (Correcao 3)
// 1) No primeiro toque: tela cheia + screen.orientation.lock('landscape').
// 2) Plano B (iPhone ou navegador que bloqueia): se a janela estiver em pe, o canvas e girado 90 graus por CSS
//    e as coordenadas de toque/mouse sao convertidas para o sistema girado. Nunca mostramos 'gire o celular'.
(function () {
  var rotated = false;
  var lastKey = '';

  function viewSize() {
    var w = window.innerWidth || document.documentElement.clientWidth;
    var h = window.innerHeight || document.documentElement.clientHeight;
    return [w, h];
  }

  function layout() {
    var c = document.getElementById('canvas');
    if (!c) { return; }
    var s = viewSize();
    var W = s[0];
    var H = s[1];
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var portrait = H > W;
    var key = W + 'x' + H + ':' + dpr + ':' + portrait;
    if (key === lastKey && c.width > 0) { return; }
    lastKey = key;
    rotated = portrait;
    window.tdnRotated = portrait;
    window.tdnViewW = W;
    var cw = portrait ? H : W;
    var ch = portrait ? W : H;
    c.style.width = cw + 'px';
    c.style.height = ch + 'px';
    c.width = Math.floor(cw * dpr);
    c.height = Math.floor(ch * dpr);
    if (portrait) {
      // gira 90 graus no sentido horario: canto (0,0) do jogo vai para o canto superior direito
      c.style.transform = 'translateX(' + W + 'px) rotate(90deg)';
    } else {
      c.style.transform = 'none';
    }
  }

  // Conversao de coordenadas quando girado: a Godot usa clientX/clientY e canvas.getBoundingClientRect()
  function patchCoords(proto) {
    if (!proto) { return; }
    var dx = Object.getOwnPropertyDescriptor(proto, 'clientX');
    var dy = Object.getOwnPropertyDescriptor(proto, 'clientY');
    if (!dx || !dy || !dx.get || !dy.get) { return; }
    Object.defineProperty(proto, 'clientX', {
      configurable: true, enumerable: true,
      get: function () {
        if (!rotated) { return dx.get.call(this); }
        return dy.get.call(this);
      }
    });
    Object.defineProperty(proto, 'clientY', {
      configurable: true, enumerable: true,
      get: function () {
        if (!rotated) { return dy.get.call(this); }
        return window.tdnViewW - dx.get.call(this);
      }
    });
  }
  try { patchCoords(window.Touch && Touch.prototype); } catch (e) {}
  try { patchCoords(window.MouseEvent && MouseEvent.prototype); } catch (e) {}

  function patchRect() {
    var c = document.getElementById('canvas');
    if (!c || c.tdnRectPatched) { return; }
    c.tdnRectPatched = true;
    var orig = c.getBoundingClientRect.bind(c);
    c.getBoundingClientRect = function () {
      if (!rotated) { return orig(); }
      var w = parseFloat(c.style.width) || 0;
      var h = parseFloat(c.style.height) || 0;
      return { x: 0, y: 0, left: 0, top: 0, right: w, bottom: h, width: w, height: h };
    };
  }

  // Primeiro toque/clique/tecla: tela cheia e trava em paisagem (Android/Chrome)
  var triedFullscreen = false;
  function goFullscreenLandscape() {
    if (triedFullscreen) { return; }
    triedFullscreen = true;
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    var lock = function () {
      try {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function () {});
        }
      } catch (e) {}
      setTimeout(layout, 300);
    };
    try {
      if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
        var p = req.call(el, { navigationUI: 'hide' });
        if (p && p.then) { p.then(lock).catch(lock); } else { lock(); }
      } else {
        lock();
      }
    } catch (e) { lock(); }
  }
  ['touchend', 'pointerup', 'mousedown', 'keydown'].forEach(function (t) {
    window.addEventListener(t, goFullscreenLandscape, { capture: true, passive: true });
  });

  function init() {
    patchRect();
    lastKey = '';
    layout();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(function () { lastKey = ''; layout(); }, 250); });
  document.addEventListener('fullscreenchange', function () { setTimeout(function () { lastKey = ''; layout(); }, 150); });
  // seguranca para navegadores que nao disparam resize ao girar
  setInterval(layout, 700);
})();
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":37269084,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
